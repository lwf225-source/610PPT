name: release-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Validate macOS installer
        if: runner.os == 'macOS'
        run: ./install.sh --dry-run | plutil -lint -
      - name: Exercise Windows install and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\install.ps1 -SkipSetup -NoOpen -DataDirectory "$env:RUNNER_TEMP\610ppt-data"
          .\uninstall.ps1 -DataDirectory "$env:RUNNER_TEMP\610ppt-data"
